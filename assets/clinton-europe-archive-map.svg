<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Clinton-era Europe research map</title>
  <desc id="desc">A stylized archival map of Europe for FRUS 1993-2000 Volumes XXII, XXIII, and XXIV.</desc>
  <defs>
    <linearGradient id="sea" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17324d"/>
      <stop offset="0.48" stop-color="#23606c"/>
      <stop offset="1" stop-color="#111f35"/>
    </linearGradient>
    <radialGradient id="paper" cx="52%" cy="46%" r="72%">
      <stop offset="0" stop-color="#fff4d3"/>
      <stop offset="0.68" stop-color="#dfc16b"/>
      <stop offset="1" stop-color="#9b6d32"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/>
      <path d="M0 0h24M0 0v24" stroke="#f2d895" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#091624" flood-opacity=".44"/>
    </filter>
    <style>
      .frame { fill: url(#sea); }
      .grid { fill: url(#grid); }
      .land { stroke: #fff0ba; stroke-width: 2.4; filter: url(#shadow); }
      .west { fill: #b93342; }
      .central { fill: #c99435; }
      .east { fill: #2e7567; }
      .policy { fill: #496f9c; }
      .line { stroke: #f2d895; stroke-opacity: .58; stroke-width: 1.4; }
      .title { font: 700 33px Georgia, 'Times New Roman', serif; fill: #fff3cb; letter-spacing: 0; }
      .label { font: 700 20px Georgia, 'Times New Roman', serif; fill: #fff7df; letter-spacing: 0; paint-order: stroke; stroke: #111f35; stroke-width: 4px; }
      .small-label { font: 800 13px Inter, Arial, sans-serif; fill: #1f2934; letter-spacing: 0; }
      .caption { font: 800 14px Inter, Arial, sans-serif; fill: #fff0bd; letter-spacing: 0; }
      .pin { fill: #fff3ca; stroke: #111f35; stroke-width: 3; }
      .pin-core { fill: #b93342; }
    </style>
  </defs>

  <rect width="960" height="640" class="frame"/>
  <rect width="960" height="640" class="grid"/>
  <path d="M42 42h876v556H42z" fill="none" stroke="#f2d895" stroke-width="5"/>
  <path d="M65 66h830v504H65z" fill="none" stroke="#111f35" stroke-width="3" opacity=".76"/>

  <g opacity=".72">
    <path class="line" d="M116 138h720M116 196h720M116 254h720M116 312h720M116 370h720M116 428h720"/>
    <path class="line" d="M166 116v350M246 116v350M326 116v350M406 116v350M486 116v350M566 116v350M646 116v350M726 116v350M806 116v350"/>
  </g>

  <g>
    <path class="land west" d="M248 171l42-58 54 27-8 64-39 31-45-18z"/>
    <path class="land west" d="M224 244l29-22 33 17-12 38-31 11z"/>
    <path class="land west" d="M397 266l88-26 76 43-10 92-55 55-92-22-50-62z"/>
    <path class="land central" d="M526 180l74-28 78 34 18 68-51 51-78-22-48-48z"/>
    <path class="land policy" d="M576 386l57 38 20 74 48 30-26 32-75-52-34-82z"/>
    <path class="land east" d="M650 356l65 30 42 56-26 42-72-21-47-52z"/>
    <path class="land east" d="M690 190l82 28 42 70-39 62-88-21-35-82z"/>
    <path class="land policy" d="M318 405l77-28 44 36-22 50-80 7-46-29z"/>
  </g>

  <g>
    <circle class="pin" cx="299" cy="186" r="13"/>
    <circle class="pin-core" cx="299" cy="186" r="5"/>
    <circle class="pin" cx="468" cy="327" r="13"/>
    <circle class="pin-core" cx="468" cy="327" r="5"/>
    <circle class="pin" cx="612" cy="238" r="13"/>
    <circle class="pin-core" cx="612" cy="238" r="5"/>
    <circle class="pin" cx="632" cy="465" r="13"/>
    <circle class="pin-core" cx="632" cy="465" r="5"/>
    <circle class="pin" cx="730" cy="286" r="11"/>
    <circle class="pin-core" cx="730" cy="286" r="4"/>
  </g>

  <g>
    <text x="197" y="142" class="label">UNITED KINGDOM</text>
    <text x="392" y="346" class="label">FRANCE</text>
    <text x="563" y="232" class="label">GERMANY</text>
    <text x="646" y="506" class="label">ITALY</text>
    <text x="690" y="266" class="small-label">CENTRAL AND EASTERN EUROPE</text>
    <text x="392" y="150" class="small-label">NATO, EU, G-7, OSCE</text>
  </g>

  <g transform="translate(92 448)">
    <rect width="260" height="84" rx="4" fill="url(#paper)" stroke="#fff1bd" stroke-width="2"/>
    <text x="18" y="31" class="small-label">Volumes XXII-XXIV</text>
    <path d="M20 50h178M20 67h126" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M504 548h268" stroke="#f2d895" stroke-width="2" stroke-linecap="round"/>
  <text x="82" y="574" class="title">Clinton Europe FRUS</text>
  <text x="506" y="568" class="caption">HIGH-LEVEL CONTACTS - POLICY 1993-1996 - POLICY 1997-2000</text>
</svg>
